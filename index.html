<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAKRA - Teknik Sepeda Motor</title>
    <!-- Google Fonts & FontAwesome untuk Ikon -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Meta Redirect Otomatis ke Canva Site (Menghindari Iframe Block) -->
    <meta http-equiv="refresh" content="1;url=https://yframadhan.my.canva.site/yfpembelajaran">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #F8FAFC; 
            font-family: 'Montserrat', sans-serif; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #loading-screen {
            background: linear-gradient(135deg, #F8FAFC 0%, #E6F6F5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .loading-card {
            background: white;
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 163, 158, 0.08);
            border: 1px solid rgba(0, 163, 158, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 340px;
            width: 90%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .logo-container {
            width: 64px;
            height: 64px;
            background: #E6F6F5;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 163, 158, 0.2);
            box-shadow: 0 4px 12px rgba(0, 163, 158, 0.1);
        }

        .logo-container img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .spinner-wrapper {
            position: relative;
            width: 50px;
            height: 50px;
            margin-bottom: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #E2E8F0;
            border-top: 4px solid #00A39D;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        h3 {
            color: #1E293B;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #00A39D;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        .desc {
            color: #64748b;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .direct-link {
            color: #00A39D;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px dashed #00A39D;
            transition: color 0.2s;
        }
        .direct-link:hover {
            color: #013a1c;
        }

        /* Bar progres halus di bawah kartu */
        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #E2E8F0;
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00A39D, #F5A623);
        }
    </style>
</head>
<body>

    <!-- Animasi Loading Awal Estetik Sebelum Redirect -->
    <div id="loading-screen">
        <div class="loading-card">
            <div class="logo-container">
                <img src="https://i.ibb.co.com/Q3SqvKBR/KELANA.png" alt="Kelana">
            </div>
            
            <div class="spinner-wrapper">
                <div class="spinner"></div>
            </div>

            <h3>CAKRA</h3>
            <div class="subtitle">MAN 1 Kota Cirebon</div>
            <p class="desc">Mengalihkan ke Sistem Pembelajaran Otomotif...</p>
            <a href="https://yframadhan.my.canva.site/yfpembelajaran" class="direct-link">Klik jika tidak otomatis dialihkan</a>

            <div class="progress-bar-container">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>

    <script>
        // Eksekusi redirect via Javascript setelah 1 detik
        setTimeout(function() {
            window.location.replace("https://yframadhan.my.canva.site/yfpembelajaran");
        }, 1000);
    </script>

</body>
</html>
